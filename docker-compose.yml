services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SQLITE_URL: ${SQLITE_URL:-sqlite:////app/backend/data/app.db}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jlocalpassword}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:83}
    volumes:
      - backend_data:/app/backend/data
    expose:
      - "8000"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "83:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4jlocalpassword}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    expose:
      - "7474"
      - "7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 20s

volumes:
  backend_data:
  neo4j_data:
  neo4j_logs:
